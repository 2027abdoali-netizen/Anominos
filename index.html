<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#080f12">
    <meta name="description" content="أكاديمية mr Abdo_zeinhom - منصة التعلم الذكية">
    <title>أكاديمية mr Abdo_zeinhom - منصة التعلم الذكية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080f12;
            --bg-card: #0f1d22;
            --bg-input: #060b0d;
            --accent-green: #00ff88;
            --accent-blue: #00e5ff;
            --accent-purple: #9d4edd;
            --accent-red: #ff4757;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-color: #1a323b;
            --danger-color: #ff4757;
            --glass-bg: rgba(15, 29, 34, 0.75);
            --shadow-glow: 0 0 25px rgba(0, 255, 136, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 229, 255, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), var(--shadow-glow);
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 95vh;
            overflow-y: auto;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(6, 11, 13, 0.6);
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: var(--text-main);
            min-width: max-content;
        }

        .brand-logo i {
            color: var(--accent-green);
            font-size: clamp(1rem, 2vw, 1.4rem);
        }

        .mode-badge {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            border: 1px solid var(--accent-green);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .admin-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: clamp(0.7rem, 1.5vw, 0.85rem);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            min-width: max-content;
        }

        .admin-toggle-btn:hover {
            color: var(--accent-blue);
            border-color: var(--accent-blue);
            background: rgba(0, 229, 255, 0.1);
        }

        /* ===== LOGIN SECTION ===== */
        .login-wrapper {
            padding: clamp(20px, 8vw, 50px);
            max-width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        .avatar-box {
            position: relative;
            width: clamp(80px, 25vw, 120px);
            height: clamp(80px, 25vw, 120px);
            margin: 0 auto 20px;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-green);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .avatar-box .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background: var(--accent-green);
            border-radius: 50%;
            border: 3px solid var(--bg-card);
        }

        .hero-title {
            font-size: clamp(1.3rem, 5vw, 1.8rem);
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            word-wrap: break-word;
        }

        .hero-subtitle {
            color: var(--accent-blue);
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            margin-bottom: 20px;
            word-wrap: break-word;
        }

        /* ===== FORMS ===== */
        .form-group {
            text-align: right;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .input-wrapper input, 
        .input-wrapper select,
        .input-wrapper textarea {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
        }

        .input-wrapper textarea {
            padding: 12px 15px;
            resize: vertical;
            min-height: 100px;
        }

        .input-wrapper input:focus, 
        .input-wrapper select:focus,
        .input-wrapper textarea:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: clamp(12px, 3vw, 15px);
            background: linear-gradient(135deg, var(--accent-green), #00b359);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(0, 229, 255, 0.1);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .btn-secondary:hover {
            background: rgba(0, 229, 255, 0.2);
        }

        .btn-danger {
            background: rgba(255, 71, 87, 0.1);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            background: rgba(255, 71, 87, 0.2);
        }

        /* ===== DASHBOARD ===== */
        .dashboard-view {
            display: none;
            padding: clamp(15px, 5vw, 30px);
        }

        .dashboard-view.active {
            display: block;
        }

        .dashboard-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        @media (min-width: 768px) {
            .dashboard-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 30px;
                padding-bottom: 20px;
            }
        }

        .user-welcome h2 {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            color: var(--accent-green);
        }

        .user-welcome p {
            color: var(--text-muted);
            font-size: clamp(0.8rem, 2vw, 0.9rem);
        }

        /* ===== TABS ===== */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            overflow-x: auto;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            font-weight: 600;
            transition: all 0.3s;
            white-space: nowrap;
            min-width: max-content;
        }

        .tab-btn i {
            font-size: clamp(0.9rem, 2vw, 1rem);
        }

        .tab-btn.active {
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ===== CARDS ===== */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: clamp(15px, 4vw, 20px);
            transition: all 0.3s;
        }

        .card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-3px);
        }

        .card h3 {
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            margin-bottom: 10px;
            color: var(--accent-blue);
        }

        .card p {
            color: var(--text-muted);
            font-size: clamp(0.8rem, 2vw, 0.88rem);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .card-actions button {
            flex: 1;
        }

        /* ===== STATUS MESSAGES ===== */
        .status-msg {
            margin-top: 15px;
            padding: clamp(10px, 2vw, 12px);
            border-radius: 10px;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            display: none;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        .status-msg.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-msg.error {
            background: rgba(255, 71, 87, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }

        .status-msg.success {
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        /* ===== EXAM CONTAINER ===== */
        .exam-container {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: clamp(20px, 5vw, 30px);
            margin-bottom: 20px;
        }

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }

        .exam-title {
            flex: 1;
        }

        .exam-title h2 {
            color: var(--accent-blue);
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .exam-title p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .exam-timer {
            background: linear-gradient(135deg, var(--accent-red), #ff6b7a);
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            min-width: 150px;
        }

        .exam-timer .timer-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 5px;
        }

        .exam-timer .timer-value {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .exam-timer.warning .timer-value {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .question-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .question-number {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .question-text {
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item:hover {
            border-color: var(--accent-blue);
            background: rgba(0, 229, 255, 0.05);
        }

        .option-item input {
            cursor: pointer;
            width: 20px;
            height: 20px;
        }

        .option-item.selected {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
        }

        .option-item.correct {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.15);
        }

        .option-item.incorrect {
            border-color: var(--danger-color);
            background: rgba(255, 71, 87, 0.15);
        }

        /* ===== RESULTS ===== */
        .results-container {
            background: var(--bg-card);
            border: 2px solid var(--accent-green);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }

        .results-score {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .results-percentage {
            font-size: 1.5rem;
            color: var(--accent-blue);
            margin-bottom: 20px;
        }

        .results-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .results-item {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }

        .results-item-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .results-item-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .results-item.correct .results-item-value {
            color: var(--accent-green);
        }

        .results-item.incorrect .results-item-value {
            color: var(--danger-color);
        }

        /* ===== ADMIN FORMS ===== */
        .admin-form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .admin-form-card h3 {
            color: var(--accent-blue);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .question-builder {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .question-builder .form-group {
            margin-bottom: 12px;
        }

        .options-input-group {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .options-input-group input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
        }

        .options-input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-input);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-green);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 255, 136, 0.3);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 480px) {
            .container {
                border-radius: 16px;
                max-height: 100vh;
            }

            .exam-header {
                flex-direction: column-reverse;
            }

            .exam-timer {
                min-width: auto;
                width: 100%;
            }

            .results-details {
                grid-template-columns: 1fr;
            }
        }

        .support-footer {
            text-align: center;
            padding: clamp(15px, 3vw, 20px);
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
            color: var(--text-muted);
            font-size: clamp(0.75rem, 2vw, 0.85rem);
        }

        .whatsapp-link {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .whatsapp-link:hover {
            color: var(--accent-blue);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--accent-blue);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand-logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>أكاديمية mr Abdo</span>
            </div>
            <div class="mode-badge" id="currentModeBadge">
                <i class="fa-solid fa-user-graduate"></i> بوابة الطالب
            </div>
            <button class="admin-toggle-btn" id="toggleModeBtn">
                <i class="fa-solid fa-user-shield"></i> إدارة
            </button>
        </div>

        <!-- LOGIN FORM -->
        <div class="login-wrapper" id="loginSection">
            <div class="avatar-box">
                <img src="https://via.placeholder.com/120" alt="Logo">
                <div class="status-dot"></div>
            </div>

            <h1 class="hero-title">منصة التعلم الذكية</h1>
            <p class="hero-subtitle">النظام الأكاديمي المتقدم بالذكاء الاصطناعي</p>

            <h2 style="font-size: clamp(1rem, 3vw, 1.2rem); margin-bottom: 20px; color: var(--text-muted);" id="formTitle">تسجيل دخول الطالب</h2>

            <form id="mainForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" required>
                    </div>
                </div>

                <div class="form-group">
                    <label id="codeLabel">كود الطالب الخاص</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="accessCode" placeholder="أدخل كود الدخول" required>
                    </div>
                </div>

                <div class="form-group" id="academicGroup">
                    <label>الصف الدراسي</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-layer-group"></i>
                        <select id="academicYear">
                            <option value="1">الصف الأول الثانوي</option>
                            <option value="2">الصف الثاني الثانوي</option>
                            <option value="3">الصف الثالث الثانوي</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span>دخول المنصة</span>
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
            </form>

            <div id="statusMessage" class="status-msg"></div>

            <div class="support-footer">
                الدعم الفني المباشر: 
                <a href="https://wa.me/201014540661" target="_blank" class="whatsapp-link">
                    <i class="fa-brands fa-whatsapp"></i> 01014540661
                </a>
            </div>
        </div>

        <!-- STUDENT DASHBOARD -->
        <div class="dashboard-view" id="studentDashboard">
            <div class="dashboard-header">
                <div class="user-welcome">
                    <h2 id="studentWelcomeName">مرحباً بك!</h2>
                    <p>لوحة التحكم الأكاديمية الخاصة بك</p>
                </div>
                <button class="admin-toggle-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'lessonsTab')"><i class="fa-solid fa-book-open"></i> الدروس</button>
                <button class="tab-btn" onclick="switchTab(event, 'examsTab')"><i class="fa-solid fa-pen-nib"></i> الاختبارات</button>
            </div>

            <!-- Lessons Tab -->
            <div id="lessonsTab" class="tab-content active">
                <div class="content-grid" id="lessonsContainer">
                    <!-- Lessons rendered dynamically -->
                </div>
            </div>

            <!-- Exams Tab -->
            <div id="examsTab" class="tab-content">
                <div class="content-grid" id="examsListContainer">
                    <!-- Exams rendered dynamically -->
                </div>
            </div>
        </div>

        <!-- EXAM PAGE -->
        <div class="dashboard-view" id="examPage">
            <div class="exam-container" id="examContainer">
                <!-- Exam rendered here -->
            </div>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div class="dashboard-view" id="adminDashboard">
            <div class="dashboard-header">
                <div class="user-welcome">
                    <h2>لوحة إدارة المنصة</h2>
                    <p>التحكم الكامل في المحتوى والعضوية</p>
                </div>
                <button class="admin-toggle-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchAdminTab(event, 'addLessonTab')"><i class="fa-solid fa-plus"></i> إضافة درس</button>
                <button class="tab-btn" onclick="switchAdminTab(event, 'addExamTab')"><i class="fa-solid fa-file-pen"></i> إضافة اختبار</button>
                <button class="tab-btn" onclick="switchAdminTab(event, 'manageLessonsTab')"><i class="fa-solid fa-list"></i> إدارة الدروس</button>
                <button class="tab-btn" onclick="switchAdminTab(event, 'manageExamsTab')"><i class="fa-solid fa-list"></i> إدارة الاختبارات</button>
            </div>

            <!-- Add Lesson -->
            <div id="addLessonTab" class="tab-content active">
                <div class="admin-form-card">
                    <h3><i class="fa-solid fa-plus"></i> إضافة درس جديد</h3>
                    <div class="form-group">
                        <label>عنوان الدرس</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-book"></i>
                            <input type="text" id="lessonTitle" placeholder="أدخل عنوان الدرس">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>الموضوع / الفئة</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-tag"></i>
                            <input type="text" id="lessonCategory" placeholder="مثال: الرياضيات، الفيزياء">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>وصف الدرس</label>
                        <div class="input-wrapper">
                            <textarea id="lessonDescription" placeholder="أدخل وصفاً قصيراً للدرس"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>رابط الشرح (فيديو أو مستند)</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-link"></i>
                            <input type="text" id="lessonLink" placeholder="https://...">
                        </div>
                    </div>
                    <button class="btn-primary" onclick="addNewLesson()"><i class="fa-solid fa-check"></i> نشر الدرس</button>
                </div>
            </div>

            <!-- Add Exam -->
            <div id="addExamTab" class="tab-content">
                <div class="admin-form-card">
                    <h3><i class="fa-solid fa-file-pen"></i> إضافة اختبار جديد</h3>
                    
                    <div class="form-group">
                        <label>عنوان الاختبار</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-heading"></i>
                            <input type="text" id="examTitle" placeholder="مثال: اختبار الفلسفة الأسبوعي">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>وصف الاختبار</label>
                        <div class="input-wrapper">
                            <textarea id="examDescription" placeholder="وصف قصير للاختبار"></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>مدة الاختبار (دقيقة)</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-clock"></i>
                                <input type="number" id="examDuration" placeholder="60" value="60" min="1">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>عدد الأسئلة</label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-hashtag"></i>
                                <input type="number" id="examQuestionsCount" placeholder="10" value="10" min="1">
                            </div>
                        </div>
                    </div>

                    <div id="questionsBuilder"></div>

                    <button class="btn-primary" onclick="generateQuestionsForm()"><i class="fa-solid fa-wand-magic-sparkles"></i> إنشاء نموذج الأسئلة</button>
                    <button class="btn-primary" style="background: linear-gradient(135deg, var(--accent-blue), #0099cc);" onclick="addNewExam()"><i class="fa-solid fa-check"></i> حفظ الاختبار</button>
                </div>
            </div>

            <!-- Manage Lessons -->
            <div id="manageLessonsTab" class="tab-content">
                <div id="manageLessonsContainer">
                    <!-- Lessons management rendered here -->
                </div>
            </div>

            <!-- Manage Exams -->
            <div id="manageExamsTab" class="tab-content">
                <div id="manageExamsContainer">
                    <!-- Exams management rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for lesson details -->
    <div class="modal" id="lessonModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalLessonTitle"></h2>
                <button class="modal-close" onclick="closeModal('lessonModal')">&times;</button>
            </div>
            <div id="modalLessonBody"></div>
            <div style="text-align: center; margin-top: 20px;">
                <a id="modalLessonLink" href="#" class="btn-primary" style="text-decoration: none; display: inline-block;">🎥 فتح الشرح</a>
            </div>
        </div>
    </div>

    <script src="system.js"></script>
</body>
</html>
